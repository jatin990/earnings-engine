[project]
name = "earnings-engine"
version = "0.1.0"
description = "Earnings prediction engine: predicts 1-day post-earnings price direction for NSE (India) and US stocks"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "lxml>=5.0",
    "numpy>=1.26",
    "click>=8.0",
    "python-dotenv>=1.0",
    "nsetools>=2.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0",
    "jinja2>=3.1.0",
    "pyotp>=2.9.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "urllib3>=2.0",
    "jugaad-data>=0.35.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = [
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
]
nse = [
    "nselib>=2.5.0",
    "jugaad-data>=0.28",
]
brokers = [
    "pyotp>=2.9.0",
    "kiteconnect>=5.0.0",
    "smartapi-python>=1.4.0",
    "dhanhq>=2.0.0",
    "fyers-apiv3>=3.1.0",
]
all = [
    "earnings-engine[dev,ml,nse,brokers]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --ignore=tests/manual"

[project.scripts]
earnings-engine = "earnings_engine.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earnings_engine*"]
