    <script>
        // Global Auth & Fetch Interceptor for Nexus Gateway Passcode Access
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const codeInUrl = urlParams.get('code') || urlParams.get('passcode') || urlParams.get('invite');
            if (codeInUrl) {
                localStorage.setItem('ee_passcode', codeInUrl);
            }

            const originalFetch = window.fetch;
            window.fetch = async function(...args) {
                let [resource, config] = args;
                config = config || {};
                config.headers = config.headers || {};

                const storedPasscode = localStorage.getItem('ee_passcode');
                if (storedPasscode) {
                    if (config.headers instanceof Headers) {
                        if (!config.headers.has('X-Passcode')) config.headers.set('X-Passcode', storedPasscode);
                    } else if (Array.isArray(config.headers)) {
                        config.headers.push(['X-Passcode', storedPasscode]);
                    } else {
                        if (!config.headers['X-Passcode']) config.headers['X-Passcode'] = storedPasscode;
                    }
                }

                const response = await originalFetch(resource, config);
                if (response.status === 401 && typeof resource === 'string' && resource.startsWith('/api/')) {
                    console.warn('[AUTH] 401 Unauthorized encountered. Redirecting to Nexus Gateway...');
                    const redirectUrl = '/portal?redirect=' + encodeURIComponent(window.location.pathname + window.location.hash);
                    window.location.href = redirectUrl;
                }
                return response;
            };
        })();
    </script>
</head>
