    <!-- ======================================================== -->
    <!-- 🚀 FULL SCREEN STOCK INTELLIGENCE MODAL -->
    <!-- ======================================================== -->
    <div id="stockFullScreenModal" style="display:none;position:fixed;inset:0;z-index:999999;background:rgba(2,6,18,0.96);backdrop-filter:blur(16px);flex-direction:column;overflow:hidden;">
        <!-- Top Toolbar -->
        <div style="height:48px;background:rgba(15,23,42,0.98);border-bottom:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:space-between;padding:0 1rem;gap:0.75rem;flex-shrink:0;box-shadow:0 4px 20px rgba(0,0,0,0.6);">
            <!-- Left: Stock Identity & Live Badges -->
            <div style="display:flex;align-items:center;gap:0.6rem;min-width:0;">
                <span style="font-size:1.15rem;">📈</span>
                <span id="stockModalTicker" style="font-weight:800;font-size:1.05rem;color:#ffffff;font-family:var(--font-mono);letter-spacing:0.02em;">TICKER</span>
                <span id="stockModalName" style="font-size:0.78rem;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px;">Company Intelligence</span>
                <span id="stockModalLiveBadge" class="signal-badge" style="background:rgba(16,185,129,0.15);color:#34d399;border:1px solid rgba(16,185,129,0.3);font-size:0.65rem;padding:0.12rem 0.45rem;">🟢 Live Modal View</span>
            </div>

            <!-- Middle: Quick Feature Jumpers inside Modal -->
            <div style="display:flex;align-items:center;gap:0.35rem;flex-wrap:wrap;">
                <button type="button" onclick="app.navStockModal('#consensus')" class="btn btn-sm" style="font-size:0.72rem;padding:0.22rem 0.55rem;background:rgba(99,102,241,0.15);color:#c7d2fe;border:1px solid rgba(99,102,241,0.35);border-radius:4px;cursor:pointer;" title="Jump to AI Multi-Model Consensus">🧠 AI Consensus</button>
                <button type="button" onclick="app.navStockModal('#kronos')" class="btn btn-sm" style="font-size:0.72rem;padding:0.22rem 0.55rem;background:rgba(236,72,153,0.15);color:#fbcfe8;border:1px solid rgba(236,72,153,0.35);border-radius:4px;cursor:pointer;" title="Jump to Kronos AI 14-Day Trajectory">🔮 Kronos 14D</button>
                <button type="button" onclick="app.navStockModal('#eps-derivation')" class="btn btn-sm" style="font-size:0.72rem;padding:0.22rem 0.55rem;background:rgba(56,189,248,0.15);color:#bae6fd;border:1px solid rgba(56,189,248,0.35);border-radius:4px;cursor:pointer;" title="Jump to Formula EPS Derivation">📐 Formula EPS</button>
                <button type="button" onclick="app.navStockModal('#catalysts')" class="btn btn-sm" style="font-size:0.72rem;padding:0.22rem 0.55rem;background:rgba(245,158,11,0.15);color:#fde68a;border:1px solid rgba(245,158,11,0.35);border-radius:4px;cursor:pointer;" title="Jump to News Catalysts">📰 Catalysts</button>
                <button type="button" onclick="app.refreshStockModal()" class="btn btn-sm" style="font-size:0.72rem;padding:0.22rem 0.5rem;background:rgba(255,255,255,0.06);color:#e2e8f0;border:1px solid rgba(255,255,255,0.15);border-radius:4px;cursor:pointer;" title="Reload Stock Modal">🔄 Reload</button>
            </div>

            <!-- Right: Open in New Tab Fallback & Close Button -->
            <div style="display:flex;align-items:center;gap:0.5rem;">
                <button type="button" onclick="app.openStockInNewTab()" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.15);color:#94a3b8;font-size:0.72rem;padding:0.22rem 0.55rem;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:0.3rem;" title="Open in separate browser window if needed">
                    <span>New Tab</span> ↗
                </button>
                <button type="button" onclick="app.closeStockModal()" style="background:rgba(239,68,68,0.18);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;font-weight:700;font-size:0.75rem;padding:0.25rem 0.65rem;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:0.3rem;transition:all 0.15s;" title="Close Full Screen Modal (Esc)">
                    ✕ Close <span style="font-size:0.65rem;opacity:0.75;font-family:var(--font-mono);">(Esc)</span>
                </button>
            </div>
        </div>

        <!-- Full Screen Modal Content Body -->
        <div style="flex:1;position:relative;background:#030712;overflow:hidden;">
            <!-- Loading Indicator Spinner -->
            <div id="stockModalSpinner" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#030712;z-index:10;gap:0.75rem;">
                <div style="width:38px;height:38px;border:3px solid rgba(59,130,246,0.2);border-radius:50%;border-top-color:#38bdf8;animation:spin 0.8s linear infinite;"></div>
                <div style="font-size:0.85rem;color:#94a3b8;font-weight:600;letter-spacing:0.02em;">Loading Stock Intelligence & Multi-Model Engine...</div>
            </div>
            <iframe id="stockModalIframe" src="" style="width:100%;height:100%;border:none;background:transparent;display:block;" onload="document.getElementById('stockModalSpinner').style.display='none';"></iframe>
        </div>
    </div>
