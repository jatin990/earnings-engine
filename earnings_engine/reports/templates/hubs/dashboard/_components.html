{% macro market_dropdown(id, selected='ALL', onchange='', extra_class='') %}
<select id="{{ id }}" class="{{ extra_class }}"{% if onchange %} onchange="{{ onchange }}"{% endif %} style="height: 30px; padding: 0 0.6rem; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; background: #000000; color: #ededed; font-size: 0.76rem; font-weight: 500; font-family: var(--font-sans); outline: none;">
    <option value="ALL"{% if selected == 'ALL' %} selected{% endif %}>All Markets</option>
    <option value="WATCHLIST"{% if selected == 'WATCHLIST' %} selected{% endif %}>My Watchlist</option>
    <option value="IN"{% if selected == 'IN' %} selected{% endif %}>NSE Top</option>
    <option value="US"{% if selected == 'US' %} selected{% endif %}>US Top</option>
    <option value="NSE_LARGE_CAP"{% if selected == 'NSE_LARGE_CAP' %} selected{% endif %}>NSE Large Cap</option>
    <option value="NSE_ALL"{% if selected == 'NSE_ALL' %} selected{% endif %}>NSE All</option>
</select>
{% endmacro %}
