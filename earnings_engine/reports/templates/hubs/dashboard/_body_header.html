<!-- ========================================================================= -->
<!-- 🖤 VERCEL-STYLE STICKY TOPBAR HEADER -->
<!-- ========================================================================= -->
<header class="app-topbar">

    <!-- Mobile Hamburger Toggle Button -->
    <button type="button" id="mobileSidebarToggle" class="mobile-menu-btn" onclick="app.toggleMobileSidebar()" aria-label="Toggle navigation menu" title="Open Navigation Menu">
        <span class="hamburger-icon">☰</span>
    </button>

    <!-- Left: Breadcrumb & Universe Selector -->
    <div class="topbar-left" style="display: flex; align-items: center; gap: 0.65rem; min-width: 0; flex-shrink: 0;">
        <div style="display: flex; align-items: center; gap: 0.35rem; font-size: 0.84rem;">
            <span class="topbar-breadcrumb-prefix" style="color: var(--text-muted);">engine</span>
            <span class="topbar-breadcrumb-prefix" style="color: var(--text-faint);">/</span>
            <span id="topbarBreadcrumbTab" style="color: var(--text-primary); font-weight: 600; text-transform: capitalize; white-space: nowrap;">Results</span>
        </div>

        <!-- Global Watchlist / Universe Selector -->
        <div style="display: flex; align-items: center; background: var(--bg-surface-0); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0.2rem 0.5rem;">
            <label for="globalWatchlist" style="font-size: 0.78rem; color: var(--color-gold); margin-right: 0.3rem;">⭐</label>
            <select id="globalWatchlist" onchange="app.onGlobalWatchlistChange(this.value)" style="background: transparent; border: none; color: var(--text-primary); font-size: 0.8125rem; font-weight: 500; cursor: pointer; outline: none; padding-right: 0.2rem; max-width: 150px;" title="Active universe or watchlist across all dashboard tabs">
                <option value="">All Stocks (Global)</option>
            </select>
        </div>
    </div>

    <!-- Center: Global Stock Search with [/] shortcut -->
    <div class="topbar-search-wrap" style="flex: 1; max-width: 440px; min-width: 140px; position: relative; margin: 0 0.5rem;">
        <div style="position: relative; display: flex; align-items: center;">
            <span style="position: absolute; left: 0.65rem; font-size: 0.8rem; color: var(--text-muted); pointer-events: none;">🔍</span>
            <input type="text" id="tickerSearch" placeholder="Search ticker (e.g. RELIANCE, NVDA)..." style="width: 100%; padding: 0.38rem 1.9rem 0.38rem 2rem; background: var(--bg-surface-0); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 0.8125rem; font-family: var(--font-mono); outline: none; transition: border-color 0.15s ease;" autocomplete="off">
            <span class="kbd-badge" style="position: absolute; right: 0.5rem;">/</span>
        </div>
        <div id="autocompleteDropdown" class="dropdown" style="display: none; position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--bg-surface-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-md); z-index: 1000; box-shadow: var(--shadow-modal);"></div>
    </div>

    <!-- Right: Freshness Status, Rate Quota, Control Center -->
    <div class="topbar-right-actions" style="display: flex; align-items: center; gap: 0.45rem; flex-shrink: 0;">

        <!-- Global Price Refresh Control & Action Button -->
        <div id="topPriceRefreshContainer" style="display: flex; align-items: center; background: var(--bg-surface-0); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0.15rem 0.35rem;" title="Refresh prices & price-related metrics across active screen">
            <button type="button" onclick="app.triggerGlobalPriceRefresh(true)" id="topRefreshPricesBtn" class="btn-micro" style="display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.22rem 0.6rem; font-size: 0.78rem; font-weight: 600; background: var(--color-primary-bg); color: var(--color-primary); border: 1px solid var(--color-primary-border); border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s ease;" title="Refresh prices & metrics now across active screen">
                <span id="topRefreshPricesIcon" style="display: inline-block; font-size: 0.85rem; line-height: 1;">↻</span>
                <span id="topRefreshPricesText">Refresh Prices</span>
            </button>
        </div>

        <!-- Earnings Freshness Pill -->
        <div id="topEarningsFreshnessPill" style="display: flex; align-items: center; gap: 0.35rem; background: var(--bg-surface-0); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0.22rem 0.5rem;" title="Last updated timestamp for active universe/watchlist earnings">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--color-bullish); box-shadow: 0 0 6px var(--color-bullish-glow);"></span>
            <span id="topEarningsFreshnessLabel" style="font-size: 0.76rem; font-weight: 600; color: var(--color-bullish); font-family: var(--font-mono); white-space: nowrap;">Earnings</span>
            <button type="button" onclick="app.refreshCurrentWatchlistEarnings()" id="topRefreshEarningsBtn" data-master-only="true" class="btn-micro" style="padding: 0.1rem 0.35rem; font-size: 0.68rem; margin-left: 0.2rem; background: var(--border-subtle); color: var(--text-primary); border: none; border-radius: var(--radius-xs); cursor: pointer;" title="Refresh earnings data (Master only)">
                🔄
            </button>
        </div>

        <!-- OmniRoute API Quota Pill -->
        <div id="topRateLimitPill" onclick="app.openCustomizerModal('ratelimits')" style="display: flex; align-items: center; gap: 0.35rem; background: var(--bg-surface-0); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0.22rem 0.5rem; cursor: pointer;" title="Click to view API rate limits & quotas in Control Center">
            <span style="font-size: 0.76rem;">⚡</span>
            <span id="topOpenRouterQuota" style="font-size: 0.76rem; font-weight: 600; color: var(--text-secondary); font-family: var(--font-mono); white-space: nowrap;">OmniRoute</span>
        </div>

        <!-- Global Watchlist Slide-Over Drawer Button [Shift+W] -->
        <button type="button" id="topWatchlistDrawerBtn" onclick="app.toggleWatchlistDrawer()" class="btn-micro" style="background: var(--color-gold-bg); color: var(--color-gold); border: 1px solid var(--color-gold-border); font-weight: 600; font-size: 0.78rem; padding: 0.26rem 0.6rem; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;" title="Open Global Watchlist Drawer [Shift+W]">
            ⭐ <span class="desktop-btn-label">Watchlist</span> (<span id="topbarWlCount">0</span>)
        </button>

        <!-- Custom Alert Rules Engine Button -->
        <button type="button" id="topAlertRulesBtn" onclick="app.openAlertRulesModal()" class="btn-micro" style="background: var(--color-bearish-bg); color: var(--color-bearish); border: 1px solid var(--color-bearish-border); font-weight: 600; font-size: 0.78rem; padding: 0.26rem 0.6rem; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;" title="Configure Custom Breakout & Momentum Alert Rules">
            ⚡ <span class="desktop-btn-label">Alerts</span>
        </button>

        <!-- Research Report & Dossier Exporter Button -->
        <button type="button" id="topExportCenterBtn" onclick="app.openExportPackModal()" class="btn-micro" style="background: var(--color-bullish-bg); color: var(--color-bullish); border: 1px solid var(--color-bullish-border); font-weight: 600; font-size: 0.78rem; padding: 0.26rem 0.6rem; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;" title="Export Research Dossier (PDF / CSV)">
            📑 <span class="desktop-btn-label">Export</span>
        </button>

        <!-- Page Guide Button -->
        <button type="button" onclick="app.openPageGuideModal()" class="btn-micro" style="background: var(--color-primary-bg); color: var(--color-primary); border: 1px solid var(--color-primary-border); font-weight: 600; font-size: 0.78rem; padding: 0.26rem 0.6rem; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;" title="Explain this page and the quantitative thought behind it">
            💡 <span class="desktop-btn-label">Page Guide</span>
        </button>

        <!-- Control Center Button -->
        <button type="button" onclick="app.openCustomizerModal()" class="btn-micro" style="background: var(--text-primary); color: var(--bg-canvas); font-weight: 600; font-size: 0.78rem; padding: 0.26rem 0.6rem; border-radius: var(--radius-sm); border: none; cursor: pointer; white-space: nowrap;" title="Open Control Center">
            ⚙️ <span class="desktop-btn-label">Settings</span>
        </button>
    </div>
</header>

<!-- ========================================================================= -->
<!-- 💡 GLOBAL PAGE GUIDE & FINANCIAL LOGIC MODAL                              -->
<!-- ========================================================================= -->
<div id="pageGuideModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: var(--bg-overlay); z-index: 10000; backdrop-filter: blur(10px); align-items: center; justify-content: center; padding: 1rem;">
    <div style="background: var(--bg-surface-elevated); border: 1px solid var(--border-default); border-radius: var(--radius-lg); width: 100%; max-width: 680px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-modal);">

        <!-- Modal Header -->
        <div style="padding: 1.1rem 1.35rem; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; background: var(--bg-surface);">
            <div style="display: flex; align-items: center; gap: 0.65rem;">
                <span id="pageGuideIcon" style="font-size: 1.35rem;">💡</span>
                <div>
                    <div id="pageGuideTitle" style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary);">Page Guide & Thought Architecture</div>
                    <div id="pageGuideSubtitle" style="font-size: 0.78rem; color: var(--text-muted);">Quantitative edge, metrics breakdown, and financial reasoning</div>
                </div>
            </div>
            <button type="button" onclick="app.closePageGuideModal()" style="background: transparent; border: none; color: var(--text-muted); font-size: 1.25rem; cursor: pointer; padding: 0.2rem 0.4rem; line-height: 1;">✕</button>
        </div>

        <!-- Modal Body Content -->
        <div id="pageGuideBody" style="padding: 1.25rem 1.35rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; font-size: 0.85rem; color: var(--text-secondary); line-height: 1.55;">
            <!-- Injected dynamically based on active tab -->
        </div>

        <!-- Modal Footer -->
        <div style="padding: 0.85rem 1.35rem; border-top: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; background: var(--bg-surface); font-size: 0.78rem; color: var(--text-muted);">
            <span>💡 Nexus Quantitative Intelligence System</span>
            <button type="button" onclick="app.closePageGuideModal()" class="btn btn-secondary" style="padding: 0.4rem 0.95rem; font-size: 0.8125rem;">Got it</button>
        </div>
    </div>
</div>
