<!-- Tab 2: Store Expenses & Spend Insights -->
<div class="space-y-4">
    <!-- Category Spend Distribution Row -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3" id="expenseCategoryCards">
        <div class="glass-panel p-3 text-center border-purple-500/20">
            <div class="text-[10px] font-bold text-slate-400 uppercase">🎓 Training</div>
            <div class="text-base font-extrabold font-mono text-purple-300 mt-1" id="catSpend-TRAINING">₹--</div>
        </div>
        <div class="glass-panel p-3 text-center border-pink-500/20">
            <div class="text-[10px] font-bold text-slate-400 uppercase">👕 Uniforms & Gear</div>
            <div class="text-base font-extrabold font-mono text-pink-300 mt-1" id="catSpend-UNIFORMS_GEAR">₹--</div>
        </div>
        <div class="glass-panel p-3 text-center border-indigo-500/20">
            <div class="text-[10px] font-bold text-slate-400 uppercase">🏗️ Equipment & Racks</div>
            <div class="text-base font-extrabold font-mono text-indigo-300 mt-1" id="catSpend-EQUIPMENT">₹--</div>
        </div>
        <div class="glass-panel p-3 text-center border-amber-500/20">
            <div class="text-[10px] font-bold text-slate-400 uppercase">☕ Snacks & Welfare</div>
            <div class="text-base font-extrabold font-mono text-amber-300 mt-1" id="catSpend-SNACKS_WELFARE">₹--</div>
        </div>
        <div class="glass-panel p-3 text-center border-emerald-500/20">
            <div class="text-[10px] font-bold text-slate-400 uppercase">🧹 Maintenance</div>
            <div class="text-base font-extrabold font-mono text-emerald-300 mt-1" id="catSpend-STORE_MAINTENANCE">₹--</div>
        </div>
        <div class="glass-panel p-3 text-center border-blue-500/20">
            <div class="text-[10px] font-bold text-slate-400 uppercase">📦 Operational / Misc</div>
            <div class="text-base font-extrabold font-mono text-blue-300 mt-1" id="catSpend-OPERATIONAL">₹--</div>
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="glass-panel p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 flex-wrap flex-1">
            <div class="relative min-w-[220px] flex-1">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs">🔍</span>
                <input 
                    type="text" 
                    id="expSearchInput" 
                    oninput="zeptoApp.filterExpenses()" 
                    placeholder="Search expense description, notes..." 
                    class="w-full bg-slate-900/80 border border-white/10 rounded-lg pl-8 pr-3 py-2 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-pink-500 transition"
                >
            </div>

            <select id="expCategoryFilter" onchange="zeptoApp.filterExpenses()" class="bg-slate-900/90 border border-white/15 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
                <option value="ALL" selected>⚡ All Categories</option>
                <option value="TRAINING">🎓 Training & Onboarding</option>
                <option value="UNIFORMS_GEAR">👕 Uniforms & Gear</option>
                <option value="EQUIPMENT">🏗️ Equipment & Racks</option>
                <option value="SNACKS_WELFARE">☕ Snacks & Welfare</option>
                <option value="STORE_MAINTENANCE">🧹 Store Maintenance</option>
                <option value="OPERATIONAL">📦 Operational Supplies</option>
                <option value="LICENSING">📜 Licensing & Compliance</option>
                <option value="MISC">📁 Misc Out-of-Pocket</option>
            </select>

            <select id="expIncurredFilter" onchange="zeptoApp.filterExpenses()" class="bg-slate-900/90 border border-white/15 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
                <option value="ALL">All Payers</option>
                <option value="Partner 1">Partner 1</option>
                <option value="Partner 2">Partner 2</option>
                <option value="STORE_CASH">Store Cash</option>
            </select>
        </div>

        <div class="flex items-center gap-2">
            <span class="text-xs font-mono text-pink-300 font-bold" id="expTotalAmountBadge">Total: ₹0</span>
            <button type="button" onclick="zeptoApp.openAddExpenseModal()" class="px-3.5 py-2 rounded-lg bg-pink-600 hover:bg-pink-500 text-white text-xs font-bold transition flex items-center gap-1.5">
                <span>➕</span> Record Expense
            </button>
        </div>
    </div>

    <!-- Expenses Table -->
    <div class="glass-panel overflow-hidden">
        <div class="overflow-x-auto custom-scrollbar max-h-[680px]">
            <table class="w-full text-left text-xs border-collapse">
                <thead>
                    <tr class="border-b border-white/10 text-slate-400 font-bold uppercase tracking-wider text-[11px]">
                        <th class="p-3.5 pl-4">Expense Title</th>
                        <th class="p-3.5">Category</th>
                        <th class="p-3.5">Date</th>
                        <th class="p-3.5">Paid By</th>
                        <th class="p-3.5 text-right">Amount</th>
                        <th class="p-3.5 text-center">Receipt / Proof</th>
                        <th class="p-3.5">Notes</th>
                        <th class="p-3.5 pr-4 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="expensesTableBody" class="divide-y divide-white/5 font-sans">
                    <tr>
                        <td colspan="8" class="p-8 text-center text-slate-500 text-xs">
                            <div class="inline-block animate-spin mr-2">⏳</div> Loading expense ledger...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
