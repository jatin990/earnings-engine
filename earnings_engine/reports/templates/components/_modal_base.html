{# Reusable base modal shell. Params: id, title, onclose #}
<div id="{{ id }}" onclick="if(event.target===this) {{ onclose }}();" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(16px);z-index:2000;padding:1.5rem;overflow-y:auto;">
    <div class="card" style="max-width:1080px;width:95%;margin:3vh auto;position:relative;background:#000000;border:1px solid rgba(255,255,255,0.15);border-radius:1rem;box-shadow:0 25px 70px rgba(0,0,0,0.95), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);padding:1.5rem;">
        <button type="button" onclick="{{ onclose }}()" style="position:absolute;top:1.25rem;right:1.25rem;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#ffffff;width:32px;height:32px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s;" title="Close">✕</button>
        {% block modal_content %}{% endblock %}
    </div>
</div>
