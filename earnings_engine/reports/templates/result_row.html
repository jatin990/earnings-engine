<tr class="results-row {day_class} {is_near_results_cls}" id="row_{row_ticker_id}" data-ticker="{ticker}" data-cap="{cap_tier}" data-industry="{industry}" data-price="{raw_price}" data-mcap="{raw_mcap}" data-3d-ret="{raw_3d}" data-7d-ret="{raw_7d}" data-30d-ret="{raw_30d}" data-rel-vol="{rel_vol_plain}" data-beat-rate="{beat_rate_plain}" data-quality="{quality_scores_plain}" onclick="app.openStockDrawer('{ticker}')" style="cursor:pointer;" title="Click to inspect {ticker} in slide-over drawer">
  <td class="stock-cell">
    <div class="stock-cell-wrap">
      <div style="display:flex;align-items:center;gap:0.35rem;">
        <span class="stock-ticker-main" style="font-weight:700;color:#f8fafc;font-size:0.82rem;">
          {ticker}
        </span>
        <button type="button" class="btn-ticker-refresh" onclick="event.stopPropagation(); app.refreshSingleStockPrice('{ticker}', this, event);" style="background:transparent;border:none;color:#64748b;cursor:pointer;font-size:0.75rem;padding:0 0.15rem;line-height:1;transition:all 0.15s;" onmouseenter="this.style.color='#38bdf8';" onmouseleave="this.style.color='#64748b';" title="Refresh live price & S/R for {ticker}">↻</button>
        <a href="/stock/{ticker}" target="_blank" style="color:#64748b;text-decoration:none;font-size:0.72rem;" onclick="event.stopPropagation();" onmouseenter="this.style.color='#38bdf8';" onmouseleave="this.style.color='#64748b';" title="Open full profile in new tab">↗</a>
        {result_sequence_badge_html}
      </div>
      <span class="stock-company-sub" style="color:#94a3b8;font-size:0.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;" title="{company_name} · {industry}">{company_name}</span>
    </div>
  </td>
  <td class="cell-earnings-date mono" style="color:#cbd5e1;font-size:0.75rem;white-space:nowrap;">
    <div style="display:flex;flex-direction:column;gap:0.1rem;">
      <span>{earnings_date}</span>
      {relative_date_badge_html}
    </div>
  </td>
  <td class="cell-current-price mono" style="color:#ffffff;font-weight:700;font-size:0.8rem;white-space:nowrap;">
    <div style="display:flex;flex-direction:column;gap:0.1rem;">
      <div style="display:flex;align-items:center;">{live_dot_html}<span>{current_price}</span></div>
      <span style="font-size:0.68rem;color:#94a3b8;font-weight:500;">{market_cap}</span>
    </div>
  </td>
  <td class="cell-returns-consolidated mono" style="font-size:0.75rem;white-space:nowrap;">
    {returns_consolidated_html}
  </td>
  <td class="cell-technical-setup" style="font-size:0.72rem;white-space:nowrap;">
    {technical_setup_badge_html}
  </td>
  <td class="cell-sr-structure" style="font-size:0.72rem;line-height:1.2;">
    {range_bar_html}
  </td>
  <td class="cell-52w-range mono" style="font-size:0.72rem;white-space:nowrap;">
    {pct_from_52w_high_low}
  </td>
  <td class="cell-rel-vol mono" style="font-size:0.75rem;text-align:center;">
    {rel_vol_html}
  </td>
</tr>
