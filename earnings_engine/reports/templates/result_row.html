<tr class="{day_class}" id="row_{row_ticker_id}"><td class="stock-cell"><a class="stock-link" onclick="openPopup('{ticker}')">{company_name}<br><span class="ticker-sub">{ticker}</span></a></td><td class="cell-earnings-date">{earnings_date}</td><td class="cell-market-cap">{market_cap}</td><td class="cell-current-price">{current_price}</td><td class="cell-thirty-day-return">{thirty_day_return}</td><td class="cell-q1-week-hl">{q1_week_hl}</td><td class="cell-q2-week-hl">{q2_week_hl}</td><td class="cell-q3-week-hl">{q3_week_hl}</td><td class="cell-pct-52w-hl">{pct_from_52w_high_low}</td><td class="cell-quality-scores">{quality_scores}</td><td class="cell-prev-3q-score">{prev_3q_score}</td><td class="cell-next-resistance">{next_resistance}</td><td class="cell-current-support">{current_support}</td><td>{kronos_14d}</td><td>{gbm_prediction}</td><td class="cell-actions" style="white-space:nowrap;"><div style="display:flex;gap:0.35rem;align-items:center;"><button type="button" class="btn btn-sm" onclick="app.recalculateRow('{ticker}', this)" title="Refresh live earnings date, prices, and recalculate metrics" style="padding:0.2rem 0.5rem;font-size:0.75rem;background:rgba(59,130,246,0.15);color:#93c5fd;border:1px solid rgba(59,130,246,0.35);border-radius:0.35rem;cursor:pointer;font-weight:600;">🔄 Recalc</button><button type="button" class="btn btn-sm" onclick="app.showTickerAuditModal('{ticker}')" title="View recalculation audit history" style="padding:0.2rem 0.45rem;font-size:0.75rem;background:rgba(255,255,255,0.06);color:var(--muted);border:1px solid rgba(255,255,255,0.15);border-radius:0.35rem;cursor:pointer;">📜</button></div></td></tr>
