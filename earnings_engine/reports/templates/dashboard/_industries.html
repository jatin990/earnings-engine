{% import 'dashboard/_components.html' as comps %}
        <div id="tab-industries" class="tab-content">
            <section class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                    <h3 style="margin: 0; font-size: 1.1rem;">🏭 Recent Earnings by Industry</h3>
                    <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
    {{ comps.market_dropdown('indMarket', 'IN', '') }}
                        <select id="indLookback" style="padding: 0.4rem; border: 1px solid rgba(255,255,255,0.2); border-radius: 0.4rem; background: rgba(255,255,255,0.05); color: var(--light);">
                            <option value="30">30 days</option>
                            <option value="60" selected>60 days</option>
                            <option value="90">90 days</option>
                        </select>
                        <button onclick="app.loadIndustryMoves()" class="btn btn-primary btn-sm">🔄 Refresh</button>
                        <button onclick="app.classifyIndustries()" class="btn btn-primary btn-sm" style="background: #8b5cf6;">🏷️ Classify Industries</button>
                    </div>
                </div>
                <p class="timestamp" style="margin: 0 0 0.75rem 0;">Past results with the realized high/low move over the 7 trading days after each result date (vs the close before the result). Grouped by industry, best-to-worst.</p>
                <div id="indSummary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem;"></div>
                <div id="indBestBanner"></div>
                <div id="indGroups"></div>
                <div id="indStatus" class="timestamp" style="margin-top: 0.5rem;"></div>
            </section>
        </div>

        <!-- ================= PATTERNS TAB ================= -->
