{% import 'dashboard/_components.html' as comps %}
        <div id="tab-coverage" class="tab-content">
            <section class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                    <h3 style="margin: 0; font-size: 1.1rem;">📋 Data Coverage</h3>
                    <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
    {{ comps.market_dropdown('coverageMarket', 'ALL', '') }}
                        <input type="text" id="coverageSearch" placeholder="Filter ticker..." style="width: 160px; padding: 0.4rem; border: 1px solid rgba(255,255,255,0.2); border-radius: 0.4rem; background: rgba(255,255,255,0.05); color: var(--light);" oninput="app.renderCoverageTable()">
                        <button onclick="app.loadDataCoverage()" class="btn btn-primary btn-sm">🔄 Refresh</button>
                        <button onclick="app.runIncrementalEarnings()" class="btn btn-primary btn-sm" style="background: #8b5cf6;">⚡ Fetch Missing Earnings</button>
                    </div>
                </div>
                <div id="coverageSummary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem;"></div>
                <div class="table-wrapper">
                    <table class="results-table">
                        <thead><tr>
                            <th>Ticker</th>
                            <th>Listing Date</th>
                            <th>Price Start</th>
                            <th>Price End</th>
                            <th>Price Rows</th>
                            <th>Earnings Start</th>
                            <th>Earnings End</th>
                            <th>Earnings Rows</th>
                            <th>Earnings Fresh</th>
                        </tr></thead>
                        <tbody id="coverageTable"></tbody>
                    </table>
                </div>
                <div id="coverageStatus" class="timestamp" style="margin-top: 0.5rem;"></div>
            </section>
        </div>

        <!-- ================= INDUSTRIES TAB ================= -->
