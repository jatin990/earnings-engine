<body>
    <div class="container">
        <!-- Top App Navigation & Controls Header -->
        <header class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 1.15rem 1.4rem; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem; position: relative; z-index: 1000; border-color: rgba(255,255,255,0.1);">
            <div style="display: flex; align-items: center; gap: 0.85rem;">
                <a href="/portal" class="btn" style="padding: 0.5rem 0.75rem; background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.35); color: #c7d2fe; border-radius: 0.65rem;" title="Switch App / Nexus Portal">
                    <span>🧭</span>
                    <span style="font-size: 0.78rem; font-weight: 700;">Portal Hub</span>
                </a>
                <a href="/credit-card" class="btn" style="padding: 0.5rem 0.75rem; background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.3); color: #7dd3fc; border-radius: 0.65rem;" title="Credit Card & Wealth Hub">
                    <span>💳</span>
                    <span style="font-size: 0.78rem; font-weight: 700;">Cards</span>
                </a>
                <div>
                    <h1 class="brand-title" style="margin: 0; font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                        EARNINGS ENGINE // TERMINAL
                    </h1>
                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.2rem;">
                        <span id="lastRefreshed" class="timestamp">Loading...</span>
                    </div>
                </div>
            </div>

            <!-- Global Watchlist, Freshness Pill, Rate Limit Pill, User & Config -->
            <div style="display: flex; align-items: center; gap: 0.65rem; flex-wrap: wrap;">
                
                <!-- Watchlist Selector -->
                <div style="display: flex; align-items: center; gap: 0.5rem; background: rgba(0,0,0,0.35); padding: 0.4rem 0.75rem; border-radius: 0.65rem; border: 1px solid rgba(255,255,255,0.08);">
                    <label for="globalWatchlist" style="font-size: 0.78rem; font-weight: 700; color: #94a3b8; display: flex; align-items: center; gap: 0.35rem; white-space: nowrap;">
                        <span>⭐ Universe:</span>
                    </label>
                    <select id="globalWatchlist" onchange="app.onGlobalWatchlistChange(this.value)" style="min-width: 210px; padding: 0.4rem 0.7rem; border: 1px solid rgba(99,102,241,0.4); border-radius: 0.5rem; background: #0e1626; color: #f8fafc; font-size: 0.82rem; font-weight: 600; cursor: pointer; outline: none;" title="Active universe or watchlist across all dashboard tabs">
                        <option value="">🌐 All Stocks (Global)</option>
                    </select>
                </div>

                <!-- Watchlist Earnings Freshness & On-Demand Refresh Pill -->
                <div id="topEarningsFreshnessPill" style="display: flex; align-items: center; gap: 0.5rem; background: rgba(56,189,248,0.1); padding: 0.35rem 0.65rem; border-radius: 0.65rem; border: 1px solid rgba(56,189,248,0.3);" title="Last updated timestamp for active universe/watchlist earnings">
                    <span style="font-size: 0.85rem;">📅</span>
                    <div style="display: flex; flex-direction: column; line-height: 1.15;">
                        <span id="topEarningsFreshnessLabel" style="font-size: 0.72rem; font-weight: 700; color: #38bdf8; font-family: 'JetBrains Mono', monospace;">Earnings: Loading...</span>
                        <span id="topEarningsFreshnessSub" style="font-size: 0.62rem; color: #94a3b8;">Persistent Cache</span>
                    </div>
                    <button onclick="app.refreshCurrentWatchlistEarnings()" id="topRefreshEarningsBtn" class="btn btn-sm" style="padding: 0.2rem 0.45rem; background: rgba(56,189,248,0.2); hover:bg-sky-500/30; border: 1px solid rgba(56,189,248,0.4); color: #e0f2fe; font-size: 0.7rem; font-weight: 700; border-radius: 0.45rem;" title="Refresh earnings data for currently selected watchlist">
                        🔄 Refresh
                    </button>
                </div>

                <!-- Rate Limits Pill -->
                <div id="topRateLimitPill" onclick="app.openCustomizerModal('ratelimits')" style="display: flex; align-items: center; gap: 0.45rem; background: rgba(99,102,241,0.12); padding: 0.4rem 0.75rem; border-radius: 0.65rem; border: 1px solid rgba(99,102,241,0.35); cursor: pointer; transition: all 0.2s;" title="Click to view API rate limits & downstream quotas in Control Center">
                    <span style="font-size: 0.95rem;">⚡</span>
                    <div style="display: flex; flex-direction: column; line-height: 1.15;">
                        <span id="topOpenRouterQuota" style="font-size: 0.74rem; font-weight: 700; color: #c084fc; font-family: 'JetBrains Mono', monospace;">OpenRouter: 0/200 reqs</span>
                        <span id="topRateLimitStatus" style="font-size: 0.64rem; color: #34d399; font-weight: 600;">🟢 Quotas Healthy</span>
                    </div>
                </div>

                <!-- User Profile & Key Pill -->
                <div id="topUserPill" style="display: flex; align-items: center; gap: 0.4rem; background: rgba(16,185,129,0.1); padding: 0.4rem 0.75rem; border-radius: 0.65rem; border: 1px solid rgba(16,185,129,0.25);">
                    <span style="width: 7px; height: 7px; border-radius: 50%; background: #34d399;"></span>
                    <span id="topUserBadge" style="font-size: 0.76rem; font-weight: 700; color: #a7f3d0;">VIP Access</span>
                </div>

                <button onclick="app.openCustomizerModal()" class="btn" style="padding: 0.5rem 0.85rem; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: #fff; border: none; border-radius: 0.65rem; font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; gap: 0.35rem; box-shadow: 0 4px 14px rgba(99,102,241,0.35); cursor: pointer;" title="Customize visible tabs, color themes, and environment variables">⚙️ Control Center</button>
            </div>
        </header>

        <!-- Search Bar -->
        <section class="card" style="padding: 0.85rem 1rem;">
            <div class="search-wrap">
                <input type="text" id="tickerSearch" placeholder="🔍 Search stock symbol (e.g., AAPL, RELIANCE.NS, NVDA)..." style="width: 100%; padding: 0.75rem 1rem; border: 1px solid rgba(255,255,255,0.12); border-radius: 0.65rem; background: rgba(0,0,0,0.3); color: var(--light); font-size: 0.95rem; font-family: 'JetBrains Mono', monospace;" autocomplete="off">
                <div id="autocompleteDropdown" class="dropdown"></div>
            </div>
        </section>

        <!-- Navigation Tabs -->
        <section class="card" style="padding: 0.85rem; display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: center;">
            <button id="tabBtn-results" data-tab="results" class="tab-btn active" onclick="app.switchTab('results')">📊 Results</button>
            <button id="tabBtn-monthfilter" data-tab="monthfilter" class="tab-btn" onclick="app.switchTab('monthfilter')">🗓️ Month Filter</button>
            <button id="tabBtn-scanner" data-tab="scanner" class="tab-btn" onclick="app.switchTab('scanner')">🔍 Scanner</button>
            <button id="tabBtn-catalysts" data-tab="catalysts" class="tab-btn" onclick="app.switchTab('catalysts')">📰 Catalysts</button>
            <button id="tabBtn-gainers" data-tab="gainers" class="tab-btn" onclick="app.switchTab('gainers')">🚀 Gainers & Patterns</button>
            <button id="tabBtn-swing" data-tab="swing" class="tab-btn" onclick="app.switchTab('swing')">🔄 Swing</button>
            <button id="tabBtn-kronos" data-tab="kronos" class="tab-btn" onclick="app.switchTab('kronos')">🤖 Kronos</button>
            <button id="tabBtn-consensus" data-tab="consensus" class="tab-btn" onclick="app.switchTab('consensus')">🧠 AI Consensus</button>
            <button id="tabBtn-playground" data-tab="playground" class="tab-btn" onclick="app.switchTab('playground')">🧪 Playground</button>
            <button id="tabBtn-coverage" data-tab="coverage" class="tab-btn" onclick="app.switchTab('coverage')">📊 Data Coverage</button>
            <button id="tabBtn-industries" data-tab="industries" class="tab-btn" onclick="app.switchTab('industries')">🏭 Industries</button>
            <button id="tabBtn-patterns" data-tab="patterns" class="tab-btn" onclick="app.switchTab('patterns')">📊 Patterns</button>
            <button id="tabBtn-buydip" data-tab="buydip" class="tab-btn" onclick="app.switchTab('buydip')">🛒 Buy the Dip</button>
            <button id="tabBtn-backtest" data-tab="backtest" class="tab-btn" onclick="app.switchTab('backtest')">📈 Backtest</button>
            <button id="tabBtn-watchlist" data-tab="watchlist" class="tab-btn" onclick="app.switchTab('watchlist')">⭐ Watchlist</button>
            <button class="tab-btn" onclick="app.openCustomizerModal('tabs')" style="margin-left: auto; background: rgba(99,102,241,0.12); border: 1px dashed rgba(99,102,241,0.4); color: #c7d2fe; display: flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; padding: 0.45rem 0.8rem;" title="Customize and toggle visible tabs on/off">⚙️ Customize Tabs</button>
        </section>
