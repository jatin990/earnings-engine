<!-- ========================================================================= -->
<!-- 🖤 VERCEL-STYLE STICKY TOPBAR HEADER -->
<!-- ========================================================================= -->
<header class="app-topbar">
    
    <!-- Mobile Hamburger Toggle Button -->
    <button type="button" id="mobileSidebarToggle" class="mobile-menu-btn" onclick="app.toggleMobileSidebar()" aria-label="Toggle navigation menu" title="Open Navigation Menu">
        <span class="hamburger-icon">☰</span>
    </button>
    
    <!-- Left: Breadcrumb & Universe Selector -->
    <div class="topbar-left" style="display: flex; align-items: center; gap: 0.6rem; min-width: 0; flex-shrink: 0;">
        <div style="display: flex; align-items: center; gap: 0.35rem; font-size: 0.8125rem;">
            <span class="topbar-breadcrumb-prefix" style="color: #71717a;">engine</span>
            <span class="topbar-breadcrumb-prefix" style="color: #3f3f46;">/</span>
            <span id="topbarBreadcrumbTab" style="color: #ededed; font-weight: 600; text-transform: capitalize; white-space: nowrap;">Results</span>
        </div>

        <!-- Global Watchlist / Universe Selector -->
        <div style="display: flex; align-items: center; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; padding: 0.15rem 0.45rem;">
            <label for="globalWatchlist" style="font-size: 0.72rem; color: #a1a1aa; margin-right: 0.25rem;">⭐</label>
            <select id="globalWatchlist" onchange="app.onGlobalWatchlistChange(this.value)" style="background: transparent; border: none; color: #ededed; font-size: 0.75rem; font-weight: 500; cursor: pointer; outline: none; padding-right: 0.2rem; max-width: 140px;" title="Active universe or watchlist across all dashboard tabs">
                <option value="">All Stocks (Global)</option>
            </select>
        </div>
    </div>

    <!-- Center: Global Stock Search with [/] shortcut -->
    <div class="topbar-search-wrap" style="flex: 1; max-width: 420px; min-width: 130px; position: relative; margin: 0 0.4rem;">
        <div style="position: relative; display: flex; align-items: center;">
            <span style="position: absolute; left: 0.6rem; font-size: 0.75rem; color: #71717a; pointer-events: none;">🔍</span>
            <input type="text" id="tickerSearch" placeholder="Search ticker (e.g. RELIANCE, NVDA)..." style="width: 100%; padding: 0.32rem 1.8rem 0.32rem 1.8rem; background: #080808; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; color: #ededed; font-size: 0.76rem; font-family: var(--font-mono); outline: none; transition: border-color 0.15s ease;" autocomplete="off">
            <span class="kbd-badge" style="position: absolute; right: 0.45rem;">/</span>
        </div>
        <div id="autocompleteDropdown" class="dropdown" style="display: none; position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.9);"></div>
    </div>

    <!-- Right: Freshness Status, Rate Quota, Control Center -->
    <div class="topbar-right-actions" style="display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0;">
        
        <!-- Global Price Refresh Control & Freshness Pill -->
        <div id="topPriceRefreshContainer" style="display: flex; align-items: center; gap: 0.3rem; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; padding: 0.2rem 0.45rem;" title="Global Ticker Price Auto-Refresh Interval">
            <span style="font-size: 0.72rem;">⏱️</span>
            <select id="globalPriceRefreshSelect" onchange="app.setGlobalPriceRefreshInterval(this.value)" style="background: transparent; color: #38bdf8; border: none; font-size: 0.7rem; font-weight: 700; font-family: var(--font-mono); outline: none; cursor: pointer; padding: 0;" title="Select global ticker price refresh interval">
                <option value="60">1m</option>
                <option value="120">2m</option>
                <option value="300" selected>5m (Default)</option>
                <option value="600">10m</option>
                <option value="900">15m</option>
                <option value="0">Manual</option>
            </select>
            <button type="button" onclick="app.triggerGlobalPriceRefresh(true)" id="topRefreshPricesBtn" class="btn-micro" style="padding: 0.08rem 0.3rem; font-size: 0.62rem; margin-left: 0.15rem; background: rgba(56,189,248,0.15); color: #38bdf8; border: 1px solid rgba(56,189,248,0.3); border-radius: 4px; cursor: pointer;" title="Refresh prices now across active page">
                ↻
            </button>
        </div>

        <!-- Earnings Freshness Pill -->
        <div id="topEarningsFreshnessPill" style="display: flex; align-items: center; gap: 0.3rem; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; padding: 0.2rem 0.45rem;" title="Last updated timestamp for active universe/watchlist earnings">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: #34d399; box-shadow: 0 0 6px #34d399;"></span>
            <span id="topEarningsFreshnessLabel" style="font-size: 0.7rem; font-weight: 500; color: #34d399; font-family: var(--font-mono); white-space: nowrap;">Earnings</span>
            <button type="button" onclick="app.refreshCurrentWatchlistEarnings()" id="topRefreshEarningsBtn" data-master-only="true" class="btn-micro" style="padding: 0.08rem 0.3rem; font-size: 0.62rem; margin-left: 0.15rem; background: rgba(255,255,255,0.06); color: #ededed; border: none; border-radius: 4px; cursor: pointer;" title="Refresh earnings data (Master only)">
                🔄
            </button>
        </div>

        <!-- OmniRoute API Quota Pill -->
        <div id="topRateLimitPill" onclick="app.openCustomizerModal('ratelimits')" style="display: flex; align-items: center; gap: 0.3rem; background: #0a0a0a; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; padding: 0.22rem 0.45rem; cursor: pointer;" title="Click to view API rate limits & quotas in Control Center">
            <span style="font-size: 0.72rem;">⚡</span>
            <span id="topOpenRouterQuota" style="font-size: 0.7rem; font-weight: 600; color: #e2e8f0; font-family: var(--font-mono); white-space: nowrap;">OmniRoute</span>
        </div>

        <!-- Page Guide Button -->
        <button type="button" onclick="app.openPageGuideModal()" class="btn-micro" style="background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); font-weight: 600; font-size: 0.72rem; padding: 0.25rem 0.55rem; border-radius: 5px; cursor: pointer; white-space: nowrap;" title="Explain this page and the quantitative thought behind it">
            💡 <span class="desktop-btn-label">Page Guide</span>
        </button>

        <!-- Control Center Button -->
        <button type="button" onclick="app.openCustomizerModal()" class="btn-micro" style="background: #ffffff; color: #000000; font-weight: 600; font-size: 0.72rem; padding: 0.25rem 0.55rem; border-radius: 5px; border: none; cursor: pointer; white-space: nowrap;" title="Open Control Center">
            ⚙️ <span class="desktop-btn-label">Settings</span>
        </button>
    </div>
</header>

<!-- ========================================================================= -->
<!-- 💡 GLOBAL PAGE GUIDE & FINANCIAL LOGIC MODAL                              -->
<!-- ========================================================================= -->
<div id="pageGuideModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 1rem;">
    <div style="background: #090d16; border: 1px solid rgba(59,130,246,0.35); border-radius: 12px; width: 100%; max-width: 680px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.85);">
        
        <!-- Modal Header -->
        <div style="padding: 1rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; background: rgba(15,23,42,0.6);">
            <div style="display: flex; align-items: center; gap: 0.6rem;">
                <span id="pageGuideIcon" style="font-size: 1.3rem;">💡</span>
                <div>
                    <div id="pageGuideTitle" style="font-size: 1.05rem; font-weight: 700; color: #f8fafc;">Page Guide & Thought Architecture</div>
                    <div id="pageGuideSubtitle" style="font-size: 0.72rem; color: #94a3b8;">Quantitative edge, metrics breakdown, and financial reasoning</div>
                </div>
            </div>
            <button type="button" onclick="app.closePageGuideModal()" style="background: transparent; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; padding: 0.2rem 0.4rem; line-height: 1;">✕</button>
        </div>

        <!-- Modal Body Content -->
        <div id="pageGuideBody" style="padding: 1.2rem 1.25rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; font-size: 0.8rem; color: #cbd5e1; line-height: 1.5;">
            <!-- Injected dynamically based on active tab -->
        </div>

        <!-- Modal Footer -->
        <div style="padding: 0.75rem 1.25rem; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; background: rgba(15,23,42,0.4); font-size: 0.72rem; color: #64748b;">
            <span>💡 Nexus Quantitative Intelligence System</span>
            <button type="button" onclick="app.closePageGuideModal()" class="btn btn-secondary" style="padding: 0.35rem 0.85rem; font-size: 0.75rem;">Got it</button>
        </div>
    </div>
</div>
