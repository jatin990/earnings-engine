<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnings Engine // Quantum Trading Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #05030a;
            --card: rgba(18, 10, 32, 0.78);
            --card-elevated: rgba(28, 15, 52, 0.92);
            --card-border: rgba(168, 85, 247, 0.18);
            --card-border-hover: rgba(192, 132, 252, 0.5);
            --accent: #9333ea;
            --accent-vivid: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --cyan: #38bdf8;
            --green: #10b981;
            --red: #f43f5e;
            --amber: #fbbf24;
            --purple: #c084fc;
            --purple-dark: #1e0d38;
            --light: #f8fafc;
            --muted: #a78bfa;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 1.25rem;
            min-height: 100vh;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% -15%, rgba(147, 51, 234, 0.22), transparent 55%),
                radial-gradient(circle at 0% 100%, rgba(56, 189, 248, 0.08), transparent 45%),
                radial-gradient(circle at 100% 50%, rgba(168, 85, 247, 0.12), transparent 50%);
            color: var(--light);
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Velvet Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(5, 3, 10, 0.9); }
        ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.25); border-radius: 4px; border: 1px solid rgba(168, 85, 247, 0.15); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.6); box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); }

        .container { max-width: 1680px; margin: 0 auto; }
        
        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -0.03em;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 1.15rem;
            padding: 1.35rem;
            margin-bottom: 1.15rem;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.7), 0 0 25px -10px rgba(147, 51, 234, 0.15);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            border-color: var(--card-border-hover);
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.8), 0 0 35px -5px rgba(168, 85, 247, 0.25);
        }

        .tab-btn {
            padding: 0.55rem 1.15rem;
            border: 1px solid rgba(168, 85, 247, 0.15);
            background: rgba(18, 10, 32, 0.6);
            color: var(--muted);
            border-radius: 0.75rem;
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--light);
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(192, 132, 252, 0.4);
            transform: translateY(-1.5px);
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.2);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 50%, #6366f1 100%);
            border-color: rgba(216, 180, 254, 0.7);
            color: #ffffff;
            box-shadow: 0 4px 22px rgba(147, 51, 234, 0.5), 0 0 10px rgba(168, 85, 247, 0.3);
            font-weight: 700;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.65rem;
            border: none;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(147, 51, 234, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-primary:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 8px 24px rgba(147, 51, 234, 0.6);
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
        }

        .btn-danger {
            background: rgba(244, 63, 94, 0.18);
            border: 1px solid rgba(244, 63, 94, 0.35);
            color: #fb7185;
        }

        .btn-danger:hover {
            background: rgba(244, 63, 94, 0.28);
        }

        .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.74rem; }

        .price-positive { color: var(--green); font-weight: 700; }
        .price-negative { color: var(--red); font-weight: 700; }

        .autocomplete-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(168, 85, 247, 0.1);
            transition: background 0.15s;
        }

        .autocomplete-item:hover, .autocomplete-item.selected {
            background: rgba(147, 51, 234, 0.25);
            color: #ffffff;
        }

        /* Redesigned Velvet Purple Results Table */
        .results-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        .results-table th, .results-table td {
            padding: 0.75rem 0.9rem;
            border-bottom: 1px solid rgba(168, 85, 247, 0.12);
            text-align: left;
            white-space: normal;
            word-wrap: break-word;
        }

        .results-table th {
            color: var(--muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            cursor: pointer;
            user-select: none;
            font-weight: 700;
            background: linear-gradient(180deg, rgba(28, 15, 52, 0.95) 0%, rgba(18, 10, 32, 0.95) 100%);
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .results-table th:hover { color: var(--cyan); }
        .results-table tbody tr:hover { background: rgba(168, 85, 247, 0.08); }

        .metric {
            background: rgba(28, 15, 52, 0.45);
            border: 1px solid rgba(168, 85, 247, 0.16);
            border-radius: 0.85rem;
            padding: 0.85rem 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .metric span { display: block; font-size: 0.7rem; color: var(--muted); margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .metric strong { font-size: 1.05rem; font-family: 'JetBrains Mono', monospace; color: #ffffff; }

        .widget-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.1rem; margin-bottom: 1.1rem; }
        .widget-card { background: rgba(18, 10, 32, 0.65); border: 1px solid rgba(168, 85, 247, 0.16); border-radius: 0.95rem; padding: 1.15rem; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5); }
        #kronosWidgets { grid-template-columns: repeat(auto-fill, minmax(640px, 1fr)); }
        .widget-card h4 { margin: 0 0 0.5rem 0; color: var(--light); font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; }

        .signal-badge {
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 0.85rem; border: 1px solid rgba(168, 85, 247, 0.16); }

        .bd-section { border: 1px solid rgba(168, 85, 247, 0.16); border-radius: 0.85rem; background: rgba(18, 10, 32, 0.5); overflow: hidden; margin-bottom: 0.75rem; }
        .bd-section-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0.75rem 1rem; background: rgba(28, 15, 52, 0.6); border: none; border-bottom: 1px solid rgba(168, 85, 247, 0.12); color: var(--light); font-size: 0.88rem; font-weight: 700; cursor: pointer; text-align: left; }
        .bd-section-header:hover { background: rgba(168, 85, 247, 0.12); }
        .bd-toggle { font-size: 0.72rem; color: var(--muted); }
        .bd-section-body { padding: 0.5rem; }

        .search-wrap { position: relative; z-index: 1000; }
        .dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #0c0717; border: 1px solid rgba(168, 85, 247, 0.35); border-radius: 0.75rem; margin-top: 0.35rem; max-height: 340px; overflow-y: auto; z-index: 10000; box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(147, 51, 234, 0.2); }

        .timestamp { color: var(--muted); font-size: 0.78rem; font-family: 'JetBrains Mono', monospace; }
        
        select { background-color: #0c0717 !important; color: var(--light) !important; position: relative; z-index: 10; border: 1px solid rgba(168, 85, 247, 0.25) !important; border-radius: 0.5rem; }
        select:focus { border-color: var(--accent-vivid) !important; outline: none; box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.3) !important; }
        select option { background-color: #0c0717; color: var(--light); }

        .loading-spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid rgba(168, 85, 247, 0.2); border-radius: 50%; border-top-color: var(--accent-vivid); animation: spin 0.8s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) { body { padding: 0.5rem; } .card { padding: 1rem; } .widget-grid { grid-template-columns: 1fr; } }

        /* Day legend & sections */
        .day-legend { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0; padding: 0.75rem 1rem; background: rgba(28, 15, 52, 0.35); border-radius: 0.75rem; border: 1px solid rgba(168, 85, 247, 0.15); }
        .day-chip { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--muted); }
        .day-chip .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

        .day-0 { border-left: 4px solid #38bdf8 !important; background: rgba(56, 189, 248, 0.05) !important; }
        .day-1 { border-left: 4px solid #10b981 !important; background: rgba(16, 185, 129, 0.05) !important; }
        .day-2 { border-left: 4px solid #fbbf24 !important; background: rgba(251, 191, 36, 0.05) !important; }
        .day-3 { border-left: 4px solid #f472b6 !important; background: rgba(244, 114, 182, 0.05) !important; }
        .day-4 { border-left: 4px solid #a78bfa !important; background: rgba(167, 139, 250, 0.05) !important; }
        .day-5 { border-left: 4px solid #fb923c !important; background: rgba(251, 146, 60, 0.05) !important; }
        .day-6 { border-left: 4px solid #2dd4bf !important; background: rgba(45, 212, 191, 0.05) !important; }
        .day-7 { border-left: 4px solid #f87171 !important; background: rgba(248, 113, 113, 0.05) !important; }

        .day-section { margin-top: 1.25rem; border: 1px solid rgba(168, 85, 247, 0.16); border-radius: 0.85rem; overflow: hidden; background: rgba(18, 10, 32, 0.4); }
        .day-section > summary { cursor: pointer; padding: 0.85rem 1.15rem; background: rgba(28, 15, 52, 0.6); font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 0.75rem; list-style: none; }
        .day-section > summary::-webkit-details-marker { display: none; }
        .day-section > summary:hover { background: rgba(168, 85, 247, 0.12); }
        .day-section > summary .day-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .day-section > summary .day-count { color: var(--muted); font-size: 0.78rem; font-weight: 500; font-family: 'JetBrains Mono', monospace; }
        .day-section > summary .chevron { margin-left: auto; transition: transform 0.2s; }
        .day-section[open] > summary .chevron { transform: rotate(180deg); }
        .day-section-body { padding: 0.85rem; }

        .cap-section { margin-top: 0.65rem; border: 1px solid rgba(168, 85, 247, 0.12); border-radius: 0.65rem; overflow: hidden; }
        .cap-section > summary { cursor: pointer; padding: 0.6rem 0.95rem; background: rgba(28, 15, 52, 0.4); font-weight: 600; font-size: 0.88rem; display: flex; align-items: center; gap: 0.5rem; list-style: none; }
        .cap-section > summary::-webkit-details-marker { display: none; }
        .cap-section > summary:hover { background: rgba(168, 85, 247, 0.1); }
        .cap-section > summary .cap-count { color: var(--muted); font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; }
        .cap-section > summary .chevron { margin-left: auto; transition: transform 0.2s; }
        .cap-section[open] > summary .chevron { transform: rotate(180deg); }
        .cap-section-body { padding: 0.65rem; }

        .pred-bullish { color: #34d399; font-weight: 700; }
        .pred-bearish { color: #f87171; font-weight: 700; }
        .pred-neutral { color: #fbbf24; font-weight: 700; }
        .pred-muted { color: var(--muted); }

        .stock-cell a.stock-link { color: #c084fc; text-decoration: none; cursor: pointer; font-weight: 700; font-family: 'JetBrains Mono', monospace; transition: color 0.15s; }
        .stock-cell a.stock-link:hover { color: #e9d5ff; text-decoration: underline; }
        .ticker-sub { font-size: 0.65rem; color: var(--text-muted); font-weight: 400; }

        /* Velvet Modal windows */
        .popup-modal { display: none; position: fixed; inset: 0; z-index: 3000; }
        .popup-modal .popup-backdrop { position: absolute; inset: 0; background: rgba(4, 2, 8, 0.88); backdrop-filter: blur(12px); }
        .popup-modal .popup-content { position: relative; max-width: 1100px; width: 95%; margin: 3vh auto; max-height: 90vh; overflow-y: auto; background: #0c0717; border: 1px solid rgba(168, 85, 247, 0.35); border-radius: 1.25rem; padding: 1.75rem; box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 50px rgba(147, 51, 234, 0.25); }
        .popup-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid rgba(168, 85, 247, 0.2); padding-bottom: 1rem; margin-bottom: 1.25rem; }
        .popup-title { font-size: 1.35rem; font-weight: 800; color: #f8fafc; font-family: 'Space Grotesk', sans-serif; }
        .popup-sub { font-size: 0.78rem; color: var(--muted); }
        .popup-close { background: rgba(168, 85, 247, 0.12); border: 1px solid rgba(168, 85, 247, 0.25); color: #e2e8f0; border-radius: 9999px; width: 32px; height: 32px; cursor: pointer; font-size: 0.9rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .popup-close:hover { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }
    </style>
</head>
