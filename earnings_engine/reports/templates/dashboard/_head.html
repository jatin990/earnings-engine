<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnings Engine // Quantum Trading Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --font-sans: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'Geist Mono', 'JetBrains Mono', 'Fira Code', monospace;
            --font-heading: 'Geist', 'Space Grotesk', 'Inter', sans-serif;

            --bg: #000000;
            --bg-mesh: radial-gradient(circle at 50% -20%, rgba(168, 85, 247, 0.16), transparent 60%),
                       radial-gradient(circle at 100% 40%, rgba(147, 51, 234, 0.1), transparent 50%),
                       radial-gradient(circle at 0% 100%, rgba(56, 189, 248, 0.06), transparent 45%);
            --card: rgba(8, 4, 18, 0.82);
            --card-elevated: rgba(14, 6, 30, 0.92);
            --card-border: rgba(168, 85, 247, 0.22);
            --card-border-hover: rgba(192, 132, 252, 0.75);
            --card-glow: 0 0 30px rgba(168, 85, 247, 0.35), 0 12px 40px rgba(0, 0, 0, 0.95);
            --accent: #9333ea;
            --accent-vivid: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.45);
            --cyan: #38bdf8;
            --green: #10b981;
            --red: #f43f5e;
            --amber: #fbbf24;
            --purple: #c084fc;
            --purple-dark: #0d031c;
            --light: #f8fafc;
            --muted: #c084fc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            margin: 0;
            padding: 1.25rem;
            min-height: 100vh;
            background-color: var(--bg);
            background-image: var(--bg-mesh);
            background-attachment: fixed;
            color: var(--light);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Futuristic Neon Purple Scrollbar */
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.98); }
        ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.3); border-radius: 4px; border: 1px solid rgba(168, 85, 247, 0.2); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(192, 132, 252, 0.8); box-shadow: 0 0 14px rgba(168, 85, 247, 0.6); }

        .container { max-width: 1720px; margin: 0 auto; }
        
        .brand-title {
            font-family: var(--font-heading);
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #e9d5ff 40%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mono {
            font-family: var(--font-mono);
        }

        /* Sleek Cyber-Glass Card with Glow-On-Hover */
        .card {
            background: var(--card);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid var(--card-border);
            border-radius: 1.15rem;
            padding: 1.35rem;
            margin-bottom: 1.15rem;
            box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.8), 0 0 20px -8px rgba(147, 51, 234, 0.15);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .card:hover {
            border-color: var(--card-border-hover);
            box-shadow: var(--card-glow);
            transform: translateY(-2px);
        }

        .tab-btn {
            padding: 0.55rem 1.15rem;
            border: 1px solid rgba(168, 85, 247, 0.18);
            background: rgba(12, 5, 26, 0.7);
            color: #d8b4fe;
            border-radius: 0.75rem;
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 600;
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(168, 85, 247, 0.22);
            border-color: rgba(192, 132, 252, 0.6);
            transform: translateY(-1.5px);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 50%, #6366f1 100%);
            border-color: rgba(233, 213, 255, 0.85);
            color: #ffffff;
            box-shadow: 0 4px 25px rgba(147, 51, 234, 0.6), 0 0 15px rgba(192, 132, 252, 0.45);
            font-weight: 700;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: cyberFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes cyberFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.65rem;
            border: none;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #9333ea 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 4px 18px rgba(147, 51, 234, 0.45);
            border: 1px solid rgba(233, 213, 255, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 8px 28px rgba(147, 51, 234, 0.7), 0 0 16px rgba(192, 132, 252, 0.4);
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
        }

        .btn-danger {
            background: rgba(244, 63, 94, 0.18);
            border: 1px solid rgba(244, 63, 94, 0.4);
            color: #fb7185;
        }

        .btn-danger:hover {
            background: rgba(244, 63, 94, 0.32);
            box-shadow: 0 0 18px rgba(244, 63, 94, 0.4);
        }

        .btn-sm { padding: 0.32rem 0.7rem; font-size: 0.75rem; }

        .price-positive { color: var(--green); font-weight: 700; text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
        .price-negative { color: var(--red); font-weight: 700; text-shadow: 0 0 10px rgba(244, 63, 94, 0.3); }

        .autocomplete-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(168, 85, 247, 0.12);
            transition: background 0.15s;
        }

        .autocomplete-item:hover, .autocomplete-item.selected {
            background: rgba(147, 51, 234, 0.3);
            color: #ffffff;
            box-shadow: inset 3px 0 0 #c084fc;
        }

        /* Redesigned Cyber Obsidian Purple Results Table */
        .results-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        .results-table th, .results-table td {
            padding: 0.78rem 0.95rem;
            border-bottom: 1px solid rgba(168, 85, 247, 0.14);
            text-align: left;
            white-space: normal;
            word-wrap: break-word;
        }

        .results-table th {
            color: #d8b4fe;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            cursor: pointer;
            user-select: none;
            font-weight: 700;
            background: linear-gradient(180deg, rgba(22, 10, 46, 0.95) 0%, rgba(12, 5, 26, 0.95) 100%);
            border-top: 1px solid rgba(168, 85, 247, 0.2);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .results-table th:hover { color: var(--cyan); }
        .results-table tbody tr { transition: all 0.18s ease; }
        .results-table tbody tr:hover {
            background: rgba(168, 85, 247, 0.12);
            box-shadow: inset 0 0 20px rgba(168, 85, 247, 0.15);
        }

        .metric {
            background: rgba(18, 8, 38, 0.55);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 0.85rem;
            padding: 0.85rem 1rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.22s ease;
        }

        .metric:hover {
            border-color: rgba(192, 132, 252, 0.6);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            transform: translateY(-1.5px);
        }

        .metric span { display: block; font-size: 0.7rem; color: #c084fc; margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .metric strong { font-size: 1.08rem; font-family: 'JetBrains Mono', monospace; color: #ffffff; }

        .widget-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.1rem; margin-bottom: 1.1rem; }
        .widget-card {
            background: rgba(12, 5, 28, 0.72);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 0.95rem;
            padding: 1.15rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .widget-card:hover {
            border-color: rgba(192, 132, 252, 0.7);
            box-shadow: 0 0 28px rgba(168, 85, 247, 0.35), 0 10px 35px rgba(0, 0, 0, 0.8);
            transform: translateY(-2px);
        }

        #kronosWidgets { grid-template-columns: repeat(auto-fill, minmax(640px, 1fr)); }
        .widget-card h4 { margin: 0 0 0.5rem 0; color: var(--light); font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; }

        .signal-badge {
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.2);
        }

        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 0.85rem; border: 1px solid rgba(168, 85, 247, 0.2); }

        .bd-section { border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 0.85rem; background: rgba(10, 4, 24, 0.6); overflow: hidden; margin-bottom: 0.75rem; transition: all 0.22s ease; }
        .bd-section:hover { border-color: rgba(192, 132, 252, 0.5); box-shadow: 0 0 20px rgba(168, 85, 247, 0.25); }
        .bd-section-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0.75rem 1rem; background: rgba(22, 10, 46, 0.7); border: none; border-bottom: 1px solid rgba(168, 85, 247, 0.15); color: var(--light); font-size: 0.88rem; font-weight: 700; cursor: pointer; text-align: left; }
        .bd-section-header:hover { background: rgba(168, 85, 247, 0.16); }
        .bd-toggle { font-size: 0.72rem; color: #d8b4fe; }
        .bd-section-body { padding: 0.5rem; }

        .search-wrap { position: relative; z-index: 1000; }
        .dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #080312; border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 0.75rem; margin-top: 0.35rem; max-height: 340px; overflow-y: auto; z-index: 10000; box-shadow: 0 25px 60px rgba(0,0,0,0.95), 0 0 35px rgba(147, 51, 234, 0.3); }

        .timestamp { color: #c084fc; font-size: 0.78rem; font-family: 'JetBrains Mono', monospace; }
        
        select { background-color: #080312 !important; color: var(--light) !important; position: relative; z-index: 10; border: 1px solid rgba(168, 85, 247, 0.3) !important; border-radius: 0.5rem; }
        select:focus { border-color: var(--accent-vivid) !important; outline: none; box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.4) !important; }
        select option { background-color: #080312; color: var(--light); }

        .loading-spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid rgba(168, 85, 247, 0.25); border-radius: 50%; border-top-color: var(--accent-vivid); animation: spin 0.8s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) { body { padding: 0.5rem; } .card { padding: 1rem; } .widget-grid { grid-template-columns: 1fr; } }

        /* Day legend & sections */
        .day-legend { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0; padding: 0.75rem 1rem; background: rgba(18, 8, 38, 0.45); border-radius: 0.75rem; border: 1px solid rgba(168, 85, 247, 0.2); }
        .day-chip { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: #d8b4fe; }
        .day-chip .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

        .day-0 { border-left: 4px solid #38bdf8 !important; background: rgba(56, 189, 248, 0.08) !important; }
        .day-1 { border-left: 4px solid #10b981 !important; background: rgba(16, 185, 129, 0.08) !important; }
        .day-2 { border-left: 4px solid #fbbf24 !important; background: rgba(251, 191, 36, 0.08) !important; }
        .day-3 { border-left: 4px solid #f472b6 !important; background: rgba(244, 114, 182, 0.08) !important; }
        .day-4 { border-left: 4px solid #a78bfa !important; background: rgba(167, 139, 250, 0.08) !important; }
        .day-5 { border-left: 4px solid #fb923c !important; background: rgba(251, 146, 60, 0.08) !important; }
        .day-6 { border-left: 4px solid #2dd4bf !important; background: rgba(45, 212, 191, 0.08) !important; }
        .day-7 { border-left: 4px solid #f87171 !important; background: rgba(248, 113, 113, 0.08) !important; }

        .day-section { margin-top: 1.25rem; border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 0.85rem; overflow: hidden; background: rgba(10, 4, 24, 0.5); transition: all 0.22s ease; }
        .day-section:hover { border-color: rgba(192, 132, 252, 0.55); box-shadow: 0 0 25px rgba(168, 85, 247, 0.25); }
        .day-section > summary { cursor: pointer; padding: 0.85rem 1.15rem; background: rgba(22, 10, 46, 0.7); font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 0.75rem; list-style: none; }
        .day-section > summary::-webkit-details-marker { display: none; }
        .day-section > summary:hover { background: rgba(168, 85, 247, 0.18); }
        .day-section > summary .day-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
        .day-section > summary .day-count { color: #d8b4fe; font-size: 0.78rem; font-weight: 500; font-family: 'JetBrains Mono', monospace; }
        .day-section > summary .chevron { margin-left: auto; transition: transform 0.2s; }
        .day-section[open] > summary .chevron { transform: rotate(180deg); }
        .day-section-body { padding: 0.85rem; }

        .cap-section { margin-top: 0.65rem; border: 1px solid rgba(168, 85, 247, 0.16); border-radius: 0.65rem; overflow: hidden; }
        .cap-section > summary { cursor: pointer; padding: 0.6rem 0.95rem; background: rgba(22, 10, 46, 0.5); font-weight: 600; font-size: 0.88rem; display: flex; align-items: center; gap: 0.5rem; list-style: none; }
        .cap-section > summary::-webkit-details-marker { display: none; }
        .cap-section > summary:hover { background: rgba(168, 85, 247, 0.15); }
        .cap-section > summary .cap-count { color: #d8b4fe; font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; }
        .cap-section > summary .chevron { margin-left: auto; transition: transform 0.2s; }
        .cap-section[open] > summary .chevron { transform: rotate(180deg); }
        .cap-section-body { padding: 0.65rem; }

        .pred-bullish { color: #34d399; font-weight: 700; text-shadow: 0 0 8px rgba(52, 211, 153, 0.4); }
        .pred-bearish { color: #f87171; font-weight: 700; text-shadow: 0 0 8px rgba(248, 113, 113, 0.4); }
        .pred-neutral { color: #fbbf24; font-weight: 700; text-shadow: 0 0 8px rgba(251, 191, 36, 0.4); }
        .pred-muted { color: #c084fc; }

        .stock-cell a.stock-link { color: #c084fc; text-decoration: none; cursor: pointer; font-weight: 700; font-family: 'JetBrains Mono', monospace; transition: all 0.15s; }
        .stock-cell a.stock-link:hover { color: #ffffff; text-shadow: 0 0 10px rgba(192, 132, 252, 0.7); }
        .ticker-sub { font-size: 0.65rem; color: var(--text-muted); font-weight: 400; }

        /* Velvet Modal windows */
        .popup-modal { display: none; position: fixed; inset: 0; z-index: 3000; }
        .popup-modal .popup-backdrop { position: absolute; inset: 0; background: rgba(2, 0, 6, 0.92); backdrop-filter: blur(16px); }
        .popup-modal .popup-content { position: relative; max-width: 1100px; width: 95%; margin: 3vh auto; max-height: 90vh; overflow-y: auto; background: #080312; border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 1.25rem; padding: 1.75rem; box-shadow: 0 30px 90px rgba(0,0,0,0.95), 0 0 60px rgba(147, 51, 234, 0.35); }
        .popup-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid rgba(168, 85, 247, 0.25); padding-bottom: 1rem; margin-bottom: 1.25rem; }
        .popup-title { font-size: 1.35rem; font-weight: 800; color: #f8fafc; font-family: 'Space Grotesk', sans-serif; }
        .popup-sub { font-size: 0.78rem; color: #d8b4fe; }
        .popup-close { background: rgba(168, 85, 247, 0.16); border: 1px solid rgba(168, 85, 247, 0.3); color: #e2e8f0; border-radius: 9999px; width: 32px; height: 32px; cursor: pointer; font-size: 0.9rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .popup-close:hover { background: rgba(239, 68, 68, 0.3); color: #fca5a5; border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 12px rgba(239, 68, 68, 0.5); }
    </style>
    <script>
        // Global Auth & Fetch Interceptor for Nexus Gateway Passcode Access
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const codeInUrl = urlParams.get('code') || urlParams.get('passcode') || urlParams.get('invite');
            if (codeInUrl) {
                localStorage.setItem('ee_passcode', codeInUrl);
            }

            const originalFetch = window.fetch;
            window.fetch = async function(...args) {
                let [resource, config] = args;
                config = config || {};
                config.headers = config.headers || {};

                const storedPasscode = localStorage.getItem('ee_passcode');
                if (storedPasscode) {
                    if (config.headers instanceof Headers) {
                        if (!config.headers.has('X-Passcode')) config.headers.set('X-Passcode', storedPasscode);
                    } else if (Array.isArray(config.headers)) {
                        config.headers.push(['X-Passcode', storedPasscode]);
                    } else {
                        if (!config.headers['X-Passcode']) config.headers['X-Passcode'] = storedPasscode;
                    }
                }

                const response = await originalFetch(resource, config);
                if (response.status === 401 && typeof resource === 'string' && resource.startsWith('/api/')) {
                    console.warn('[AUTH] 401 Unauthorized encountered. Redirecting to Nexus Gateway...');
                    const redirectUrl = '/portal?redirect=' + encodeURIComponent(window.location.pathname + window.location.hash);
                    window.location.href = redirectUrl;
                }
                return response;
            };
        })();
    </script>
</head>
