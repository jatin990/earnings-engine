<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnings Watch Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'IBM Plex Mono', var(--font-mono);
            --bg-dark: #000000;
            --surface-glass: linear-gradient(180deg, rgba(14, 14, 20, 0.75) 0%, rgba(6, 6, 10, 0.85) 100%);
            --border-glass: rgba(255, 255, 255, 0.1);
            --border-glass-sub: rgba(255, 255, 255, 0.05);
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --accent-gold: #d4af37;
            --text-light: #ffffff;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }
        * { box-sizing: border-box; }
        body {
            background-color: #000000;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.05), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(212, 175, 55, 0.03), transparent);
            background-attachment: fixed;
            color: var(--text-light);
            font-family: var(--font-sans);
            margin: 0;
            padding: 1.5rem;
            min-height: 100vh;
            overflow-x: auto;
        }
        .container { max-width: 100%; width: 100%; margin: 0 auto; padding: 0 1rem; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1.5rem; margin-bottom: 2rem;
            background: var(--surface-glass);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border-glass);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
        }
        .title-group h1 { margin: 0; font-size: 1.8rem; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; }
        .title-group p { color: var(--text-muted); margin: 0.5rem 0 0 0; font-size: 0.85rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 1.5rem; }
        .card {
            background: var(--surface-glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 1rem;
            padding: 1.5rem;
            min-width: 0;
            overflow: hidden;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.9), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
        }
        .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem; color: #ffffff; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .symbol-name { font-size: 1.2rem; font-weight: 800; color: #ffffff; }
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; font-family: var(--font-mono); }
        .badge-bullish { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-bearish { background: rgba(244, 63, 94, 0.12); color: #f87171; border: 1px solid rgba(244, 63, 94, 0.3); }
        .badge-neutral { background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 0.75rem 0; }
        .metric {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 0.6rem;
            padding: 0.6rem 0.7rem;
            min-width: 0;
            overflow: hidden;
        }
        .metric span { display: block; font-size: 0.65rem; color: var(--text-muted); margin-bottom: 0.2rem; font-weight: 600; text-transform: uppercase; }
        .metric strong { font-size: 0.85rem; overflow-wrap: break-word; word-break: break-word; color: #ffffff; font-family: var(--font-mono); }
        .commentary { font-size: 0.85rem; line-height: 1.5; color: #cbd5e1; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 0.75rem; margin-top: 0.75rem; overflow-wrap: break-word; word-break: break-word; }
        .results-table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.8rem; }
        .day-legend {
            display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0; padding: 0.75rem 1rem;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: 0.8rem;
            backdrop-filter: blur(16px);
        }
        .day-chip { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }
        .day-chip .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
        .day-0 { border-left: 4px solid #38bdf8 !important; background: rgba(56, 189, 248, 0.04) !important; }
        .day-1 { border-left: 4px solid #34d399 !important; background: rgba(52, 211, 153, 0.04) !important; }
        .day-2 { border-left: 4px solid #fbbf24 !important; background: rgba(251, 191, 36, 0.04) !important; }
        .day-3 { border-left: 4px solid #2dd4bf !important; background: rgba(45, 212, 191, 0.04) !important; }
        .day-4 { border-left: 4px solid #818cf8 !important; background: rgba(129, 140, 248, 0.04) !important; }
        .day-5 { border-left: 4px solid #fb923c !important; background: rgba(251, 146, 60, 0.04) !important; }
        .day-6 { border-left: 4px solid #a78bfa !important; background: rgba(167, 139, 250, 0.04) !important; }
        .day-7 { border-left: 4px solid #f87171 !important; background: rgba(248, 113, 113, 0.04) !important; }
        .card.day-0 { border-top: 3px solid #38bdf8 !important; }
        .card.day-1 { border-top: 3px solid #34d399 !important; }
        .card.day-2 { border-top: 3px solid #fbbf24 !important; }
        .card.day-3 { border-top: 3px solid #2dd4bf !important; }
        .card.day-4 { border-top: 3px solid #818cf8 !important; }
        .card.day-5 { border-top: 3px solid #fb923c !important; }
        .card.day-6 { border-top: 3px solid #a78bfa !important; }
        .card.day-7 { border-top: 3px solid #f87171 !important; }
        .results-table th, .results-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.06); text-align: left; white-space: normal; word-wrap: break-word; }
        .results-table th,
        table thead th,
        table th {
            color: var(--text-muted);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: sticky !important;
            top: 0 !important;
            z-index: 20 !important;
            background: #000000 !important;
            box-shadow: 0 1px 0 rgba(255,255,255,0.14) !important;
            font-weight: 700;
        }
        .results-table td {
            font-family: var(--font-mono);
            color: #cbd5e1;
        }
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -1rem; padding: 0 1rem; }
        .table-wrapper::-webkit-scrollbar { height: 6px; width: 6px; }
        .table-wrapper::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.4); }
        .table-wrapper::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
        .table-wrapper::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
        footer { text-align: center; color: var(--text-dim); font-size: 0.8rem; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 1.5rem; margin-top: 2rem; font-family: var(--font-mono); }
        /* Collapsible day sections */
        .day-section {
            margin-top: 1.5rem;
            border: 1px solid var(--border-glass);
            border-radius: 1rem;
            overflow: hidden;
            background: var(--surface-glass);
            backdrop-filter: blur(24px);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.8), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
        }
        .day-section > summary {
            cursor: pointer;
            padding: 1rem 1.25rem;
            background: rgba(255,255,255,0.02);
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            list-style: none;
            color: #ffffff;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .day-section > summary::-webkit-details-marker { display: none; }
        .day-section > summary:hover { background: rgba(255,255,255,0.05); }
        .day-section > summary .day-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .day-section > summary .day-count { color: var(--text-muted); font-size: 0.8rem; font-weight: 500; font-family: var(--font-mono); }
        .day-section > summary .chevron { margin-left: auto; transition: transform 0.2s; color: var(--text-muted); }
        .day-section[open] > summary .chevron { transform: rotate(180deg); }
        .day-section-body { padding: 1.25rem; }
        /* Cap category sections */
        .cap-section { margin-top: 0.75rem; border: 1px solid rgba(255,255,255,0.06); border-radius: 0.75rem; overflow: hidden; background: rgba(0,0,0,0.4); }
        .cap-section > summary { cursor: pointer; padding: 0.75rem 1rem; background: rgba(255,255,255,0.02); font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; list-style: none; color: #ffffff; }
        .cap-section > summary::-webkit-details-marker { display: none; }
        .cap-section > summary:hover { background: rgba(255,255,255,0.05); }
        .cap-section > summary .cap-count { color: var(--text-muted); font-size: 0.75rem; font-weight: 400; font-family: var(--font-mono); }
        .cap-section > summary .chevron { margin-left: auto; transition: transform 0.2s; }
        .cap-section[open] > summary .chevron { transform: rotate(180deg); }
        .cap-section-body { padding: 0.75rem; }
        .cap-badge-large { background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 0.15rem 0.5rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 700; font-family: var(--font-mono); }
        .cap-badge-small { background: rgba(212, 175, 55, 0.12); color: #d4af37; border: 1px solid rgba(212, 175, 55, 0.3); padding: 0.15rem 0.5rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 700; font-family: var(--font-mono); }
        /* Prediction badges */
        .pred-bullish { color: #34d399; font-weight: 700; }
        .pred-bearish { color: #f87171; font-weight: 700; }
        .pred-neutral { color: #fbbf24; font-weight: 700; }
        .pred-muted { color: var(--text-muted); }
        /* Clickable stock cell in ledger */
        .stock-cell a.stock-link { color: #38bdf8; text-decoration: none; cursor: pointer; font-weight: 700; }
        .stock-cell a.stock-link:hover { color: #7dd3fc; text-decoration: underline; }
        .ticker-sub { font-size: 0.65rem; color: var(--text-muted); font-weight: 400; font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Popup / modal */
        .popup-modal { display: none; position: fixed; inset: 0; z-index: 1000; }
        .popup-modal .popup-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); }
        .popup-modal .popup-content {
            position: relative;
            max-width: 760px;
            width: 92%;
            margin: 4vh auto;
            max-height: 88vh;
            overflow-y: auto;
            background: #000000;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 25px 70px rgba(0,0,0,0.95), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }
        .popup-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; margin-bottom: 1rem; }
        .popup-title { font-size: 1.3rem; font-weight: 800; color: #ffffff; }
        .popup-sub { font-size: 0.78rem; color: var(--text-muted); font-family: var(--font-mono); }
        .popup-close { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #ffffff; border-radius: 9999px; width: 32px; height: 32px; cursor: pointer; font-size: 0.9rem; flex-shrink: 0; transition: background 0.15s; }
        .popup-close:hover { background: rgba(255,255,255,0.15); }
        .popup-section { margin-bottom: 1.1rem; }
        .popup-section-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; padding-bottom: 0.35rem; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        .popup-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.6rem; }
        .popup-text { font-size: 0.85rem; line-height: 1.55; color: #cbd5e1; white-space: pre-wrap; word-wrap: break-word; }
        .src-kronos .popup-section-title { color: #38bdf8; }
        .src-gbm .popup-section-title { color: #38bdf8; }
        .src-ollama .popup-section-title { color: #34d399; }
        .src-setup .popup-section-title { color: #fbbf24; }
        @media (max-width: 768px) {
            body { padding: 0.75rem; }
            .container { padding: 0 0.25rem; }
            .title-group h1 { font-size: 1.4rem; }
            .results-table th, .results-table td { padding: 0.4rem 0.5rem; font-size: 0.7rem; }
            .results-table th { font-size: 0.6rem; }
            .card { padding: 1rem; }
            .metrics-grid { grid-template-columns: 1fr; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-group">
                <h1>⚡ Earnings Watch Report</h1>
                <p>Upcoming results, momentum, and risk context for the next earnings window</p>
            </div>
        </header>
        {day_legend}
        {day_sections}
        <footer>Generated automatically by the earnings engine • Research output, not financial advice.</footer>
    </div>
    {popups}
    <script>
        function openPopup(ticker) {
            var el = document.getElementById('popup-' + ticker.replace(/[^a-zA-Z0-9]/g, '_'));
            if (el) { el.style.display = 'block'; document.body.style.overflow = 'hidden'; }
        }
        function closePopups() {
            document.querySelectorAll('.popup-modal').forEach(function (m) { m.style.display = 'none'; });
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePopups(); });
    </script>
</body>
</html>
